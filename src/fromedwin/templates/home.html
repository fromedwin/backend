{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FromEdwin API</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1020;
      color: #e5e7eb;
    }
    .wrap {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 24px;
    }
    .logo {
      width: 170px;
      height: 170px;
    }
    .version {
      color: #9ca3af;
      margin: 0;
    }
    .links {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    .links a {
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      color: #e5e7eb;
      background: #111827;
      font-weight: 600;
    }
    .links a:hover {
      border-color: #10b981;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="{% static 'logos/fromedwin-logo.svg' %}" alt="FromEdwin logo">
    <h1>FromEdwin Monitor API</h1>
    <p class="version">Version {{ version }}</p>
    <nav class="links" aria-label="API documentation links">
      <a href="{% url 'api:swagger' %}">Swagger</a>
      <a href="{% url 'api:redoc' %}">ReDoc</a>
    </nav>
  </main>
</body>
</html>
